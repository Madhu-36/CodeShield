[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "CodeShield-dev"
version = "0.1.0"
description = "Security-First, Repository-Local Action Layer"
authors = [{ name = "Madhu" }]
dependencies = [
    "tree-sitter>=0.21.0",
    "tree-sitter-python",
    "chromadb>=0.4.0",
    "pydantic>=2.0.0",
    "typer>=0.9.0",
    "openai>=1.0.0",
    "pytest>=7.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0"
]

[project.scripts]
CodeShield-dev = "cli:app"


