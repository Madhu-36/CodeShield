name: CodeShield CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-and-benchmark:
    name: Security Gate & NPU Benchmark
    runs-on: ubuntu-latest

    steps:
    - name: Checkout CodeShield Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install Enterprise Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install typer rich pydantic tree-sitter tree-sitter-python fastapi uvicorn pytest

    - name: Run Enterprise Module Unit Tests
      run: |
        export PYTHONPATH=.
        pytest tests/enterprise/

    - name: Run CodeShield Edge-Native Benchmark Suite
      run: |
        export PYTHONPATH=.
        python cli.py benchmark

    - name: Run Differential AST Risk Audit
      run: |
        export PYTHONPATH=.
        python cli.py diff

    - name: Probe Model Context Protocol (MCP) Server
      run: |
        export PYTHONPATH=.
        python -c "
        from src.mcp.server import CodeShieldMCPServer
        srv = CodeShieldMCPServer()
        res = srv.handle_request({'jsonrpc': '2.0', 'id': 1, 'method': 'initialize'})
        assert res['result']['serverInfo']['name'] == 'codeshield-mcp'
        print('MCP Server verified successfully.')
        "
